<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>darkforge dashboard</title>
<style>
/* Generated by `darkforge dashboard`: one read-only file, no network (system fonts, inline data). */
:root{color-scheme:dark;--bg:#09090B;--s1:#111113;--s2:#18181B;--line:#27272A;--line2:#3F3F46;--ink:#FAFAFA;--mut:#A1A1AA;--dim:#8B8B94;--acc:#F97316;--ok:#22C55E;--warn:#EAB308;--err:#EF4444;--blue:#60A5FA;--vio:#A78BFA;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);overflow-x:clip}
code,.mono{font-family:var(--mono);font-size:.9em}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.15}
h1{font-size:clamp(22px,3vw,30px);font-weight:600}
h2{font-size:16px;font-weight:600}
p{margin:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.wrap{max-width:1320px;margin:0 auto;padding:0 max(3vw,16px)}
.note{font-size:13px;color:var(--dim)}
.src{font:12px var(--mono);color:var(--dim)}
.top{border-bottom:1px solid var(--line);background:var(--s1)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.proj{font:13px var(--mono);color:var(--mut);border:1px solid var(--line2);border-radius:7px;padding:3px 9px}
.gen{margin-left:auto;font-size:13px;color:var(--dim)}
.livei{font:12px var(--mono);color:var(--ok);display:inline-flex;align-items:center;gap:6px}.livei i{width:7px;height:7px;border-radius:50%;background:var(--ok)}.livei[hidden]{display:none}.livei.down{color:var(--warn)}.livei.down i{background:var(--warn)}
.lang{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.lang button{min-height:34px;min-width:38px;border:0;background:transparent;color:var(--mut);font:500 12px var(--mono);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.head{padding:26px 0 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
.head p{color:var(--mut);margin-top:8px;max-width:80ch;white-space:pre-line}
.now{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:99px;padding:3px 10px;font:12px var(--mono);color:var(--mut);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.chip.run{border-color:color-mix(in srgb,var(--acc) 55%,transparent);color:var(--acc)}.chip.run i{background:var(--acc)}
@media(max-width:760px){.head{grid-template-columns:1fr}}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fig{background:var(--s1);padding:14px 16px}
.fig span{display:block;font-size:13px;color:var(--dim)}
.fig b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.fig small{font-size:13px;color:var(--mut)}
.meter{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:18px;margin:18px 0 36px}
.col{display:grid;gap:18px;align-content:start}
.panel{border:1px solid var(--line);border-radius:12px;background:var(--s1);overflow:hidden}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ph .src{margin-left:auto}
.pb{padding:14px 16px}
@media(max-width:1020px){.grid{grid-template-columns:1fr}}
.phases{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.pc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.pc[aria-pressed=true]{border-color:color-mix(in srgb,var(--acc) 60%,var(--line))}
.pc b{display:block;font-weight:600;font-size:14px}
.pc span{font-size:13px;color:var(--mut)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{min-height:32px;padding:0 11px;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--mut);font:500 13px var(--sans);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;font-weight:500;color:var(--dim);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover,tbody tr[aria-selected=true]{background:var(--s2)}
.tid{font:500 13px var(--mono);color:var(--ink)}
.tt{font-weight:500;display:block;min-width:8em}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.st.done i{background:var(--ok)}.st.run i{background:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}.st.blocked i{background:var(--err)}.st.pending i{background:var(--warn)}
.st.run{color:var(--acc)}.st.blocked{color:var(--err)}
.risk{font:12px var(--mono);padding:1px 7px;border-radius:5px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.risk.high{border-color:color-mix(in srgb,var(--err) 55%,transparent);color:#FCA5A5}
.risk.medium{border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:#FDE68A}
.mdl{font:12px var(--mono);color:var(--mut)}
@media(max-width:760px){table.cards thead{display:none}table.cards tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;padding:12px;border-bottom:1px solid var(--line)}table.cards td{border:0;padding:0}table.cards td.c-title,table.cards td.c-status,table.cards td.c-risk,table.cards td.c-models,table.cards td.c-dep{grid-column:2/4}table.cards td.c-tok{grid-column:3;grid-row:1}}
.detail dl{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:8px 14px;margin:0;font-size:14px}
.detail dt{color:var(--dim)}.detail dd{margin:0;color:var(--mut);overflow-wrap:anywhere}
.detail h3{font-size:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px}
.bars{display:grid;gap:8px;margin-top:12px}
.brow{display:grid;grid-template-columns:5em minmax(0,1fr) 4.5em;gap:10px;align-items:center;font-size:13px}
.brow .lab{font:12px var(--mono);color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.brow em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.brow.sel .lab{color:var(--acc)}
.split2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.kv{display:grid;gap:6px;font-size:13px}
.kv div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.kv span{color:var(--mut);overflow-wrap:anywhere}.kv b{font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.hbar{height:6px;border-radius:3px;background:var(--line);grid-column:1/-1;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--blue)}
@media(max-width:520px){.split2{grid-template-columns:1fr}}
.sess{display:grid;gap:8px;margin-top:10px}
.sess div{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.sess code{color:var(--dim)}
.sess .t{font:12px var(--mono);border:1px solid var(--line2);border-radius:6px;padding:1px 7px}
.warnbox{margin-top:10px;border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 8%,var(--s1));border-radius:8px;padding:10px 12px;font-size:13px;color:#FDE68A}
.okbox{margin-top:10px;border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);border-radius:8px;padding:10px 12px;font-size:13px;color:#86EFAC}
.qs{display:grid;gap:10px}
.q{border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:10px;padding:10px 12px;background:var(--bg)}
.q b{font:500 13px var(--mono);color:var(--warn)}
.q.now{border-color:var(--warn)}
h2.warn{color:var(--warn)}
.q p{font-size:14px;margin-top:3px}
.q small{display:block;font-size:12px;color:var(--dim);margin-top:4px}
.list{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px;color:var(--mut)}
.list li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.list code{color:var(--ink)}
.cmd{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);padding:6px 6px 6px 12px;font:13px var(--mono)}
.cmd code{flex:1;overflow-wrap:anywhere}
.copy{min-height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--s2);color:var(--mut);font:12px var(--mono);cursor:pointer}
.copy.done{color:var(--ok);border-color:var(--ok)}
.empty{font-size:14px;color:var(--dim)}
pre.txt{margin:0;white-space:pre-wrap;font:13px/1.6 var(--sans);color:var(--mut)}
footer{border-top:1px solid var(--line);padding:20px 0 32px;color:var(--dim);font-size:13px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <span class="brand"><svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="#18181B" stroke="#3F3F46"/><path d="M8 21h16v3H8z" fill="#FAFAFA"/><path d="M11 17l5-9 5 9z" fill="#F97316"/><path d="M14 17h4v4h-4z" fill="#FAFAFA"/></svg>darkforge</span>
    <span class="proj" id="projName"></span>
    <span class="gen" id="gen"></span>
    <span class="livei" id="live" hidden><i></i><span id="liveS" role="status"></span><span id="liveT"></span></span>
    <div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="vi">VI</button></div>
  </div>
</header>
<main class="wrap">
  <div class="warnbox" id="failBanner" role="alert" hidden></div>
  <section class="head"><div><h1 id="headline"></h1><p id="subline"></p></div><div class="now" id="now"></div></section>
  <section class="figs" id="figs" aria-label="Key figures"></section>
  <div class="grid">
    <div class="col">
      <section class="panel"><div class="ph"><h2 data-t="phases"></h2><span class="src">docs/plans/phase-*.md · progress.md</span></div><div class="pb"><div class="phases" id="phases"></div></div></section>
      <section class="panel">
        <div class="ph"><h2 id="boardH"></h2><div class="filters" id="filters" role="group" aria-label="Filter"></div><span class="src" id="boardSrc"></span></div>
        <div style="overflow-x:auto"><table class="cards" aria-label="Tasks"><thead><tr><th data-t="thTask"></th><th data-t="thTitle"></th><th data-t="thStatus"></th><th data-t="thRisk"></th><th data-t="thModels"></th><th data-t="thDeps"></th><th class="num" data-t="thTokens"></th></tr></thead><tbody id="tasks"></tbody></table></div>
        <p class="pb empty" id="tasksEmpty" hidden></p>
      </section>
      <section class="panel detail" aria-live="polite"><div class="ph"><h2 data-t="detail"></h2><span class="src" id="detailSrc"></span></div><div class="pb" id="detail"></div></section>
    </div>
    <div class="col">
      <section class="panel"><div class="ph"><h2 data-t="next"></h2><span class="src">activeContext.md</span></div><div class="pb" style="display:grid;gap:10px"><pre class="txt" id="nextTxt"></pre><div class="cmd"><code id="c1">/clear</code><button class="copy" data-copy="c1">Copy</button></div><div class="cmd"><code id="c2"></code><button class="copy" data-copy="c2">Copy</button></div></div></section>
      <section class="panel"><div class="ph"><h2 id="qH" data-t="questions"></h2><span class="src">activeContext.md</span></div><div class="pb qs" id="questions"></div></section>
      <section class="panel"><div class="ph"><h2 data-t="ledgerH"></h2><span class="src">.darkforge/ledger.jsonl</span></div><div class="pb"><div class="legend" id="legend"></div><div class="bars" id="bars"></div><div class="split2"><div><h3 style="font-size:13px;color:var(--dim);font-weight:500;margin-bottom:8px" data-t="byModel"></h3><div class="kv" id="byModel"></div></div><div><h3 style="font-size:13px;color:var(--dim);font-weight:500;margin-bottom:8px" data-t="byKind"></h3><div class="kv" id="byKind"></div></div></div><p class="note" style="margin-top:14px" id="ledgerNote"></p></div></section>
      <section class="panel" id="costBox" hidden><div class="ph"><h2 data-t="costKind"></h2><span class="src">.darkforge/ledger.jsonl</span></div><div class="pb"><div class="kv" id="costKinds"></div></div></section>
      <section class="panel"><div class="ph"><h2 data-t="sessH"></h2></div><div class="pb"><p class="note" data-t="sessP"></p><div class="sess" id="sess"></div><div id="sessMsg"></div></div></section>
      <section class="panel"><div class="ph"><h2 data-t="decisions"></h2><span class="src">decisions.md</span></div><div class="pb"><ul class="list" id="decisions"></ul></div></section>
      <section class="panel"><div class="ph"><h2 data-t="backlog"></h2><span class="src">backlog.md</span></div><div class="pb"><ul class="list" id="backlog"></ul></div></section>
    </div>
  </div>
</main>
<footer><div class="wrap" id="foot"></div></footer>
<script>
{
const LIVE=/*DARKFORGE_LIVE*/false;
let DATA=/*DARKFORGE_DATA*/null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const k=n=>n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e3?(n/1e3).toFixed(1)+"k":String(n);
const fmtUsd=n=>!(n>0)?"$0.00":n<0.005?"<$0.01":n>=1000?"$"+(n/1e3).toFixed(1)+"k":"$"+n.toFixed(2);
const T={
 phases:["Phases","Các phase"],thTask:["Task","Task"],thTitle:["Title","Tên"],thStatus:["Status","Trạng thái"],thRisk:["Risk","Rủi ro"],thModels:["Implementer → reviewer","Implementer → reviewer"],thDeps:["Depends","Phụ thuộc"],thTokens:["Tokens","Token"],
 detail:["Task detail","Chi tiết task"],next:["Next step","Bước tiếp theo"],questions:["Waiting on you","Đang chờ bạn"],ledgerH:["Tokens by task","Token theo task"],byModel:["By model","Theo model"],byKind:["Who spent them","Ai sử dụng"],
 ledgerNote:["Best effort, not a bill. Totals include cache reads, which are billed far cheaper.","Số liệu ước tính, không phải hóa đơn. Tổng có gồm cache read, vốn tính phí rẻ hơn nhiều."],
 sessH:["Tasks per session","Task theo session"],sessP:["Main-session tokens grow when one session runs several tasks: every later call re-reads the earlier ones.","Token của phiên chính tăng khi một session chạy nhiều task: mỗi lần gọi sau phải đọc lại các task trước."],
 decisions:["Recent decisions","Quyết định gần đây"],backlog:["Backlog","Backlog"],
 foot:["Read-only page generated by <code>darkforge dashboard</code> from the repository's files. Each panel names its source. Run the command again to refresh.","Trang chỉ đọc do <code>darkforge dashboard</code> tạo từ các file trong repository. Mỗi khung ghi rõ nguồn. Chạy lại lệnh để cập nhật."],
 all:["All","Tất cả"],done:["Done","Xong"],run:["In progress","Đang chạy"],todo:["To do","Chưa làm"],blocked:["Blocked","Bị chặn"],pending:["Merge pending","Chờ merge"],
 gen:["Generated","Tạo lúc"],
 footLive:["Live page served by <code>darkforge dashboard --watch</code> on this computer only. Stop it with Ctrl+C.","Trang trực tiếp do <code>darkforge dashboard --watch</code> phục vụ, chỉ trên máy này. Dừng bằng Ctrl+C."],
 ledgerLive:["Tokens are added when each agent finishes, not while it runs.","Token được cộng khi mỗi agent xong, không phải trong lúc nó đang chạy."],
 liveOn:["Live · updated","Trực tiếp · cập nhật"],liveOff:["Disconnected, retrying","Mất kết nối, đang thử lại"],liveDead:["Disconnected; restart `darkforge dashboard --watch` and open its new URL","Mất kết nối; chạy lại `darkforge dashboard --watch` và mở URL mới"],
 costFig:["Estimated cost","Chi phí ước tính"],costKind:["Cost by token kind","Chi phí theo loại token"],
 kInput:["input","input"],kOutput:["output","output"],kCacheW:["cache write","cache write"],kCacheR:["cache read","cache read"],
 askedNow:["asked in Claude Code now","đang hỏi trong Claude Code"],mainSession:["main session","phiên chính"],
};
let lang=DATA.ownerLanguage||"en";
const L=key=>T[key]?T[key][lang==="vi"?1:0]:key;
const V=(en,vi)=>lang==="vi"?vi:en;
const PH=["implement","review","fix","orchestrator"];
const COL={implement:"var(--blue)",review:"var(--vio)",fix:"var(--warn)",orchestrator:"var(--acc)"};
let led=DATA.ledger;
let phaseN=DATA.current,filter="all",sel=null;
const phase=()=>DATA.phases.find(p=>p.n===phaseN)||null;
const tok=id=>led.byTask[id]||null;
/* the task worth looking at first: the active one, else the first not done, else the last */
const firstPick=()=>{const t=phase()?.tasks||[];return DATA.state.task||(t.find(x=>x.status!=="done")||t.at(-1))?.id||null;};
sel=firstPick();

/* the cost data may be missing (older data); every cost figure below hides then */
const own=(o,key)=>o&&Object.hasOwn(o,key)?o[key]:null;
function render(){
  const cost=DATA.cost;
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.innerHTML=L(el.dataset.t));
  $("#foot").innerHTML=L(LIVE?"footLive":"foot");
  const unp=cost?cost.unpriced:null;
  /* one price per row; "+?" marks tokens that carry no price (unknown model or no usage) */
  const usd=v=>cost&&v?fmtUsd(v.usd)+(v.unpricedTokens>0?` <span title="${V(k(v.unpricedTokens)+" tokens not priced",k(v.unpricedTokens)+" token chưa có giá")}">+?</span>`:""):"";
  $("#ledgerNote").textContent=[L("ledgerNote"),LIVE?L("ledgerLive"):"",...(cost?[
   V(`Estimated at API list prices as of ${cost.asOf}; subscription plans and discounts are not reflected.`,`Ước tính theo giá API niêm yết ngày ${cost.asOf}; không phản ánh gói thuê bao hay chiết khấu.`),
   unp.records?V(`${unp.records} records unpriced (models ${unp.models.join(", ")}).`,`${unp.records} bản ghi chưa có giá (model ${unp.models.join(", ")}).`):"",
   cost.assumed1h?V("Cache writes without a 5m/1h split counted as 1-hour.","Cache write không tách 5m/1h được tính theo loại 1 giờ."):"",
   cost.haiku55?V("Haiku 5.5 prompts over 100k tokens are priced at the lower rate.","Prompt Haiku 5.5 trên 100k token được tính theo giá thấp."):"",
   ...cost.warnings]:[])].filter(Boolean).join(" ");
  paintLive();
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  $("#projName").textContent=DATA.project;
  const g=new Date(DATA.generatedAt),gt=LIVE&&!isNaN(g)?(d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${d.toTimeString().slice(0,5)}`)(g):DATA.generatedAt.slice(0,16).replace("T"," ")+" UTC";
  $("#gen").textContent=`${L("gen")} ${gt}${DATA.plugin?" · darkforge "+DATA.plugin:""}`;
  const p=phase(),tasks=p?p.tasks:[];
  const cnt=s=>tasks.filter(t=>t.status===s).length;
  const done=cnt("done"),n=tasks.length;
  const cur=DATA.state.task;
  $("#headline").textContent=!p?V("No phase planned yet.","Chưa có phase nào được lập kế hoạch."):V(`Phase ${p.n}: ${done} of ${n} tasks done${cur?`; task ${cur} in progress`:""}.`,`Phase ${p.n}: xong ${done}/${n} task${cur?`; task ${cur} đang chạy`:""}.`);
  $("#subline").textContent=DATA.where||"";
  renderNow();
  const wq=DATA.state.waiting?DATA.state.waiting.questions:[];
  const seg=(c,v)=>n?`<i style="width:${(v/n*100).toFixed(1)}%;background:${c}"></i>`:"";
  const orchShare=led.total?Math.round(led.kinds.orchestrator/led.total*100):0;
  const cacheShare=led.total?Math.round(led.cacheRead/led.total*100):0;
  const multi=led.sessions.filter(s=>s.tasks.length>1);
  $("#figs").innerHTML=[
   [V("Phase progress","Tiến độ phase"),n?`${done}/${n}`:"—",n?V(`${cnt("run")} running · ${cnt("blocked")} blocked`,`${cnt("run")} đang chạy · ${cnt("blocked")} bị chặn`):V("no tasks","chưa có task"),n?`<div class="meter">${seg("var(--ok)",done)}${seg("var(--acc)",cnt("run"))}${seg("var(--warn)",cnt("pending"))}${seg("var(--err)",cnt("blocked"))}</div>`:""],
   [V("Tokens recorded","Token đã ghi"),led.total?k(led.total):"—",led.total?V(`${cacheShare}% cache reads`,`${cacheShare}% là cache read`):V("no ledger records yet","chưa có bản ghi ledger"),""],
   ...(cost?[[L("costFig"),fmtUsd(cost.total),V("API list prices, "+cost.asOf,"giá API niêm yết, "+cost.asOf),""]]:[]),
   [V("Main-session share","Phần của phiên chính"),led.total?orchShare+"%":"—",V("orchestrator vs all tokens","orchestrator trên tổng token"),""],
   [V("Waiting on you","Đang chờ bạn"),DATA.questions.length+wq.length,V("open questions","câu hỏi mở"),""],
   [V("Shared sessions","Session dùng chung"),multi.length,V("sessions that ran 2+ tasks","session chạy từ 2 task"),""]
  ].map(([a,b,c,d])=>`<div class="fig"><span>${a}</span><b>${esc(b)}</b><small>${c}</small>${d}</div>`).join("");
  $("#phases").innerHTML=DATA.phases.length?DATA.phases.map(q=>{const d=q.tasks.filter(t=>t.status==="done").length;const st=q.status==="done"?V("done · reviewed","xong · đã review"):q.status==="active"?V(`${d}/${q.tasks.length} merged`,`${d}/${q.tasks.length} đã merge`):V("planned","đã lập kế hoạch");return `<button class="pc" data-p="${q.n}" aria-pressed="${q.n===phaseN}"><b>${V("Phase","Phase")} ${q.n}: ${esc(q.title)}</b><span>${st}</span></button>`}).join(""):`<p class="empty">${V("No docs/plans/phase-*.md yet. Run /darkforge:plan-phase.","Chưa có docs/plans/phase-*.md. Chạy /darkforge:plan-phase.")}</p>`;
  $("#boardH").textContent=p?V(`Phase ${p.n} tasks`,`Task của phase ${p.n}`):V("Tasks","Task");
  $("#boardSrc").textContent=p?p.file:"";
  $("#filters").innerHTML=["all","done","run","pending","todo","blocked"].filter(f=>f==="all"||cnt(f)).map(f=>`<button data-f="${f}" aria-pressed="${f===filter}">${L(f)}${f==="all"?"":" "+cnt(f)}</button>`).join("");
  const rows=tasks.filter(t=>filter==="all"||t.status===filter);
  $("#tasks").innerHTML=rows.map(t=>`<tr data-id="${esc(t.id)}" tabindex="0" aria-selected="${t.id===sel}">
    <td class="c-id"><span class="tid">${esc(t.id)}</span></td>
    <td class="c-title"><span class="tt">${esc(t.title)}</span></td>
    <td class="c-status"><span class="st ${esc(t.status)}"><i></i>${L(t.status)}${t.blockedBy.length?" · "+esc(t.blockedBy.join(", ")):""}</span></td>
    <td class="c-risk"><span class="risk ${esc(t.risk)}">${esc(t.risk||"-")}</span></td>
    <td class="c-models"><span class="mdl">${esc(t.implementer)}<br>→ ${esc(t.reviewer)}</span></td>
    <td class="c-dep"><span class="mdl">${t.deps.length?esc(t.deps.join(", ")):"—"}</span></td>
    <td class="num c-tok">${tok(t.id)?k(tok(t.id).total)+(cost?"<br><small>"+usd(own(cost.byTask,t.id))+"</small>":""):"—"}</td></tr>`).join("");
  $("#tasksEmpty").hidden=rows.length>0;
  $("#tasksEmpty").textContent=p?V("No tasks match this filter.","Không có task nào khớp bộ lọc."):V("Plan a phase to see its tasks here.","Lập kế hoạch một phase để thấy các task ở đây.");
  renderDetail();
  $("#nextTxt").textContent=DATA.next||V("(empty)","(trống)");
  const nx=(DATA.next||"").toLowerCase();
  $("#c2").textContent=nx.includes("phase-review")||nx.includes("phase review")?"/darkforge:phase-review":/\bplan/.test(nx)&&!/\btask\s+\w+/.test(nx)?"/darkforge:plan-phase":"/darkforge:next-task";
  $("#qH").classList.toggle("warn",!!DATA.state.waiting);
  $("#questions").innerHTML=DATA.questions.length||wq.length?wq.map(q=>`<div class="q now"><b>${L("askedNow")}</b><p>${esc(q)}</p></div>`).join("")+DATA.questions.map(q=>`<div class="q"><b>${esc(q.id)}</b><p>${esc(q.question)}</p>${q.blocks?`<small>${V("Blocks","Chặn")}: ${esc(q.blocks)}</small>`:""}</div>`).join(""):`<p class="empty">${V("No open questions.","Không có câu hỏi mở.")}</p>`;
  $("#legend").innerHTML=PH.map(x=>`<span><i style="background:${COL[x]}"></i>${x}</span>`).join("");
  const entries=Object.entries(led.byTask);
  const mx=Math.max(1,...entries.map(([,v])=>v.total));
  $("#bars").innerHTML=entries.length?entries.map(([t,v])=>`<div class="brow${t===sel?" sel":""}"><span class="lab" title="${esc(t)}">${esc(t)}</span><div class="stack" style="width:${(v.total/mx*100).toFixed(1)}%" title="${PH.map(x=>x+" "+k(v[x])).join(", ")}">${PH.map(x=>v[x]?`<i style="width:${(v[x]/v.total*100).toFixed(1)}%;background:${COL[x]}"></i>`:"").join("")}</div><em>${k(v.total)}${cost?"<br>"+usd(own(cost.byTask,t)):""}</em></div>`).join(""):`<p class="empty">${V("No ledger records yet.","Chưa có bản ghi ledger.")}</p>`;
  const models=Object.entries(led.byModel).sort((a,b)=>b[1]-a[1]),mm=Math.max(1,...models.map(x=>x[1]));
  $("#byModel").innerHTML=models.map(([m,v])=>`<div><span class="mono">${esc(m)}</span><b>${k(v)}${cost?" · "+usd(own(cost.byModel,m)):""}</b><div class="hbar"><i style="width:${(v/mm*100).toFixed(1)}%"></i></div></div>`).join("")||`<p class="empty">—</p>`;
  $("#byKind").innerHTML=`<div><span>orchestrator</span><b>${k(led.kinds.orchestrator)}${cost?" · "+usd(cost.byKind.orchestrator):""}</b></div><div><span>subagents</span><b>${k(led.kinds.subagent)}${cost?" · "+usd(cost.byKind.subagent):""}</b></div><div><span>cache read</span><b>${k(led.cacheRead)}</b></div><div style="border-top:1px solid var(--line);padding-top:6px"><span style="color:var(--ink)">total</span><b>${k(led.total)}</b></div>`;
  $("#costBox").hidden=!cost;
  if(cost){const tk=cost.byTokenKind;$("#costKinds").innerHTML=[["kInput","input"],["kOutput","output"],["kCacheW","cacheWrite"],["kCacheR","cacheRead"]].map(([l,f])=>`<div><span>${L(l)}</span><b>${fmtUsd(tk[f])} · ${cost.total>0?Math.round(tk[f]/cost.total*100):0}%</b></div>`).join("");}
  $("#sess").innerHTML=led.sessions.slice(-6).map(s=>`<div><code>${esc(s.id)}</code>${s.tasks.map(t=>`<span class="t">${esc(t)}</span>`).join("")}</div>`).join("");
  $("#sessMsg").innerHTML=!led.sessions.length?`<p class="empty">${V("No session ids in the ledger yet (recorded from darkforge 0.3.0).","Ledger chưa có session id (được ghi từ darkforge 0.3.0).")}</p>`:multi.length?`<div class="warnbox">${V(`${multi.length} session(s) ran more than one task. Start a fresh session (/clear) before each task.`,`${multi.length} session chạy nhiều hơn một task. Hãy mở session mới (/clear) trước mỗi task.`)}</div>`:`<div class="okbox">${V("Every session ran one task.","Mỗi session chỉ chạy một task.")}</div>`;
  $("#decisions").innerHTML=DATA.decisions.length?DATA.decisions.map(d=>`<li><code>${esc(d.id)}</code><span>${esc(d.text)}${d.date?` <span class="note">· ${esc(d.date)}</span>`:""}</span></li>`).join(""):`<li class="empty">${V("No decisions recorded.","Chưa có quyết định nào.")}</li>`;
  $("#backlog").innerHTML=DATA.backlog.length?DATA.backlog.map(b=>`<li><span style="color:var(--dim)">·</span><span>${esc(b)}</span></li>`).join(""):`<li class="empty">${V("Backlog is empty.","Backlog trống.")}</li>`;
}
/* the "now" chips: task, phase, who is working, since when, fix round */
function renderNow(){
  const st=DATA.state,cur=st.task,chip=(t,c)=>`<span class="chip${c?" "+c:""}"><i></i>${esc(t)}</span>`;
  if(!cur){$("#now").innerHTML=chip(V("no active task","không có task đang chạy"));return;}
  const r=st.phase==="review"?st.reviewer:st.phase==="implement"||st.phase==="fix"?st.implementer:null;
  const who=st.phase==="orchestrator"?L("mainSession"):r?[r.agent,r.model].filter(Boolean).join(" "):"";
  const t=st.since?new Date(st.since):null,ok=t&&!isNaN(t);
  const since=ok?V("since ","từ ")+t.toTimeString().slice(0,5)+" ("+Math.max(0,Math.floor((Date.now()-t)/6e4))+V(" min)"," phút)"):"";
  $("#now").innerHTML=chip("task "+cur,"run")+chip("phase: "+(st.phase||"-"))+(who?chip(who):"")+(since?chip(since):"")+(st.round>0?chip(V("fix round ","vòng sửa ")+st.round):"");
}
/* live mode: connection indicator and the last-good-data banner */
let conn=null,lastAt=null,lastRaw=null,dead=false;
function paintLive(){
  const el=$("#live");el.hidden=!LIVE||!conn;if(el.hidden)return;
  el.className="livei"+(conn==="ok"?"":" down");
  /* only the state label is a live region; the timestamp is repainted silently */
  const st=conn==="ok"?L("liveOn"):dead?L("liveDead"):L("liveOff");
  if($("#liveS").textContent!==st)$("#liveS").textContent=st;
  $("#liveT").textContent=conn==="ok"&&lastAt?" "+lastAt:"";
}
function renderDetail(){
  const p=phase();const t=p&&p.tasks.find(x=>x.id===sel);
  if(!t){$("#detailSrc").textContent="";$("#detail").innerHTML=`<p class="empty">${V("Select a task.","Chọn một task.")}</p>`;return;}
  $("#detailSrc").textContent=p.file;
  const b=tok(t.id);
  $("#detail").innerHTML=`<h3><span class="tid">${esc(t.id)}</span> ${esc(t.title)} <span class="st ${esc(t.status)}"><i></i>${L(t.status)}</span></h3>
  <dl><dt>${V("Route","Route")}</dt><dd><span class="risk ${esc(t.risk)}">${esc(t.risk||"-")}</span> <span class="mdl">${esc(t.implementer)} → ${esc(t.reviewer)}</span></dd>
  <dt>${V("Acceptance","Tiêu chí")}</dt><dd>${esc(t.acceptance||"—")}</dd>
  <dt>${V("Tests","Test")}</dt><dd><code>${esc(t.tests||"—")}</code></dd>
  <dt>${V("Depends on","Phụ thuộc")}</dt><dd>${t.deps.length?esc(t.deps.join(", ")):"—"}</dd>
  ${t.blockedBy.length?`<dt>${V("Blocked by","Bị chặn bởi")}</dt><dd style="color:var(--err)">${esc(t.blockedBy.join(", "))}</dd>`:""}
  <dt>${V("Tokens","Token")}</dt><dd>${b?PH.map(x=>`${x} ${k(b[x])}`).join(" · ")+` · total ${k(b.total)}`:V("not started","chưa bắt đầu")}</dd></dl>`;
}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render();});
$("#phases").addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(b){phaseN=+b.dataset.p;filter="all";sel=firstPick();render();}});
$("#filters").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(b){filter=b.dataset.f;render();}});
const pick=tr=>{sel=tr.dataset.id;render();const r=[...document.querySelectorAll("#tasks tr")].find(x=>x.dataset.id===sel);r&&r.focus();};
$("#tasks").addEventListener("click",e=>{const tr=e.target.closest("tr");if(tr)pick(tr);});
$("#tasks").addEventListener("keydown",e=>{const tr=e.target.closest("tr");if(!tr)return;if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(tr);}const d={ArrowDown:"nextElementSibling",ArrowUp:"previousElementSibling"}[e.key];if(d&&tr[d]){e.preventDefault();tr[d].focus();}});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-copy]");if(!b)return;const el=document.getElementById(b.dataset.copy);try{await navigator.clipboard.writeText(el.textContent);b.textContent="Copied";b.classList.add("done");}catch{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selected";}setTimeout(()=>{b.textContent="Copy";b.classList.remove("done");},1600);});
render();
if(LIVE){
  const es=new EventSource("events");
  const stamp=()=>{lastAt=new Date().toTimeString().slice(0,8);};
  es.addEventListener("open",()=>{conn="ok";dead=false;stamp();paintLive();});
  es.addEventListener("error",()=>{conn="down";dead=es.readyState===2;paintLive();});
  es.addEventListener("message",e=>{
    conn="ok";stamp();$("#failBanner").hidden=true;paintLive();
    if(e.data===lastRaw)return; /* unchanged: no re-render, so focus and the live region stay put */
    let d;try{d=JSON.parse(e.data);}catch{return;}
    lastRaw=e.data;
    const y=scrollY,ae=document.activeElement,fk=ae&&ae.closest?["data-id","data-f","data-p"].map(n=>{const c=ae.closest("["+n+"]");return c&&[n,c.getAttribute(n)];}).find(Boolean):null;
    DATA=d;led=d.ledger;
    if(!phase())phaseN=DATA.current;
    if(!(phase()?.tasks||[]).some(x=>x.id===sel))sel=firstPick();
    render();scrollTo(0,y);
    if(fk){const n=[...document.querySelectorAll("["+fk[0]+"]")].find(x=>x.getAttribute(fk[0])===fk[1]);n&&n.focus({preventScroll:true});}
  });
  es.addEventListener("failed",e=>{$("#failBanner").textContent=e.data;$("#failBanner").hidden=false;});
  setInterval(renderNow,3e4);
}
}
</script>
</body>
</html>
